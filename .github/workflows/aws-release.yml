name: SHIFT BRIDGE AWS release

on:
  pull_request:
  push:
    branches: [main, shift-bridge]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          python3 -m venv /tmp/shift-bridge-tests
          source /tmp/shift-bridge-tests/bin/activate
          pip install -r BridgeCLI/requirements.txt 'cryptography>=48,<51'
          PYTHONPATH=Agent python -m unittest discover -s Agent/tests -v
          BRIDGE_DATA_DIR=$(mktemp -d) PYTHONPATH=BridgeCLI python -m unittest discover -s BridgeCLI/tests -v
          node --check Agent/static/app.js
          docker build -t shift-bridge-test .
      - name: Verify Render container startup and login
        run: |
          set -euo pipefail
          password=synthetic-smoke-test-password
          docker run -d --name shift-bridge-render-test -p 127.0.0.1:18000:10000 \
            -e RENDER=true -e RENDER_EXTERNAL_URL=https://shift-bridge-example.onrender.com \
            -e SHIFT_BRIDGE_WEB_PASSWORD="$password" shift-bridge-test
          trap 'docker logs shift-bridge-render-test; docker rm -f shift-bridge-render-test >/dev/null' EXIT
          url=http://127.0.0.1:18000
          curl -fsS --retry 20 --retry-delay 1 --retry-connrefused "$url/healthz"
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$url/api/logs")" = 401
          curl -fsS -u "operator:$password" "$url/api/settings/status" \
            | jq -e '.engine_ready and (.api_key_configured | not) and .signed_in_as == "operator"'

  release:
    if: github.ref == format('refs/heads/{0}', vars.AWS_RELEASE_BRANCH || 'shift-bridge') && github.event_name != 'pull_request' && vars.AWS_RELEASE_ROLE_ARN != ''
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: shift-bridge-aws-release
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Publish commit and update the web application
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          RELEASE_ROLE: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          REPOSITORY_URI: ${{ vars.AWS_ECR_REPOSITORY_URI }}
          INSTANCE: ${{ vars.AWS_APPLICATION_INSTANCE }}
          DOCUMENT: ${{ vars.AWS_RELEASE_DOCUMENT }}
        run: |
          set -euo pipefail
          : "${AWS_REGION:?}" "${RELEASE_ROLE:?}" "${REPOSITORY_URI:?}" "${INSTANCE:?}" "${DOCUMENT:?}"
          export AWS_RETRY_MODE=standard AWS_MAX_ATTEMPTS=5
          repository_name=${REPOSITORY_URI#*/}
          registry=${REPOSITORY_URI%%/*}
          umask 077
          export DOCKER_CONFIG=$(mktemp -d)
          token_file=$(mktemp)
          trap 'rm -f "$token_file"; rm -rf -- "$DOCKER_CONFIG"' EXIT
          curl --silent --show-error --fail \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq --exit-status --raw-output .value > "$token_file"
          credentials=$(aws sts assume-role-with-web-identity --role-arn "$RELEASE_ROLE" \
            --role-session-name "shift-bridge-${GITHUB_RUN_ID}" --duration-seconds 1800 \
            --web-identity-token "file://$token_file" \
            --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text)
          rm -f "$token_file"
          read -r AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN <<< "$credentials"
          unset credentials
          export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          if ! aws ecr describe-images --repository-name "$repository_name" --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            docker build --platform linux/amd64 -t "$REPOSITORY_URI:$GITHUB_SHA" .
            docker push "$REPOSITORY_URI:$GITHUB_SHA"
          fi
          command_id=$(aws ssm send-command --document-name "$DOCUMENT" --instance-ids "$INSTANCE" \
            --parameters "ImageTag=$GITHUB_SHA" --query 'Command.CommandId' --output text)
          echo "SSM command: $command_id"
          for attempt in {1..60}; do
            if status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE" \
              --query Status --output text); then
              case "$status" in
                Success) exit 0 ;;
                Failed|Cancelled|TimedOut|Cancelling) echo "AWS release $status" >&2; exit 1 ;;
              esac
            fi
            sleep 10
          done
          echo 'AWS release status timed out. Check the SSM command before retrying.' >&2
          exit 1
