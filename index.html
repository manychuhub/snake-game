<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지렁이 게임 (Snake Game)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #1a1a2e;
            color: #e94560;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            color: #0f3460;
            color: #4ecca3;
            margin-bottom: 12px;
            text-shadow: 0 0 10px rgba(78, 204, 163, 0.5);
        }
        .scoreboard {
            display: flex;
            gap: 30px;
            font-size: 1.25rem;
            font-weight: bold;
            color: #eeeeee;
            margin-bottom: 15px;
            background: #16213e;
            padding: 8px 24px;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .scoreboard span {
            color: #4ecca3;
        }
        .game-container {
            position: relative;
            background: #0f3460;
            border: 4px solid #4ecca3;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }
        canvas {
            display: block;
            background-color: #111a2e;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(16, 26, 46, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #eeeeee;
            backdrop-filter: blur(4px);
        }
        .overlay h2 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            color: #e94560;
        }
        .overlay button {
            background: #4ecca3;
            color: #111a2e;
            border: none;
            padding: 10px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(78, 204, 163, 0.4);
        }
        .overlay button:hover {
            background: #3eb891;
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(78, 204, 163, 0.6);
        }
        .guide {
            margin-top: 15px;
            color: #9aa0a6;
            font-size: 0.95rem;
            text-align: center;
        }
        .key-badge {
            display: inline-block;
            background: #16213e;
            color: #4ecca3;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid #4ecca3;
            font-size: 0.85rem;
            margin: 0 2px;
        }
    </style>
</head>
<body>

    <h1>🐍 지렁이 게임</h1>

    <div class="scoreboard">
        <div>현재 점수: <span id="currentScore">0</span></div>
        <div>최고 점수: <span id="highScore">0</span></div>
    </div>

    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div id="overlay" class="overlay">
            <h2 id="overlayTitle">지렁이 게임</h2>
            <button id="startBtn">게임 시작</button>
        </div>
    </div>

    <div class="guide">
        조작: <span class="key-badge">방향키</span> 또는 <span class="key-badge">W</span> <span class="key-badge">A</span> <span class="key-badge">S</span> <span class="key-badge">D</span> | 일시정지: <span class="key-badge">Space</span>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const currentScoreEl = document.getElementById('currentScore');
        const highScoreEl = document.getElementById('highScore');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const startBtn = document.getElementById('startBtn');

        const GRID_SIZE = 20; // 20x20 그리드
        const TILE_COUNT = canvas.width / GRID_SIZE; // 20칸

        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = 0;
        let dy = 0;
        let nextDx = 0;
        let nextDy = 0;
        let score = 0;
        let highScore = localStorage.getItem('snake_high_score') || 0;
        let gameInterval = null;
        let isRunning = false;
        let isPaused = false;
        const GAME_SPEED = 110; // ms

        highScoreEl.textContent = highScore;

        function initGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            dx = 1;
            dy = 0;
            nextDx = 1;
            nextDy = 0;
            score = 0;
            currentScoreEl.textContent = score;
            spawnFood();
        }

        function spawnFood() {
            let valid = false;
            while (!valid) {
                food.x = Math.floor(Math.random() * TILE_COUNT);
                food.y = Math.floor(Math.random() * TILE_COUNT);
                valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
            }
        }

        function startGame() {
            initGame();
            overlay.style.display = 'none';
            isRunning = true;
            isPaused = false;
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, GAME_SPEED);
        }

        function gameOver() {
            isRunning = false;
            clearInterval(gameInterval);
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snake_high_score', highScore);
                highScoreEl.textContent = highScore;
            }
            overlayTitle.textContent = '게임 오버! (점수: ' + score + ')';
            startBtn.textContent = '다시 시작';
            overlay.style.display = 'flex';
        }

        function gameLoop() {
            if (isPaused) return;

            dx = nextDx;
            dy = nextDy;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // 벽 충돌 감지
            if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
                gameOver();
                return;
            }

            // 자기 자신 충돌 감지
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            // 음식 먹기
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                currentScoreEl.textContent = score;
                spawnFood();
            } else {
                snake.pop();
            }

            draw();
        }

        function draw() {
            // 배경 지우기
            ctx.fillStyle = '#111a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 격자선 살짝 표시
            ctx.strokeStyle = '#16233b';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            // 먹이 그리기
            ctx.fillStyle = '#e94560';
            ctx.beginPath();
            const foodRadius = GRID_SIZE / 2 - 2;
            ctx.arc(
                food.x * GRID_SIZE + GRID_SIZE / 2,
                food.y * GRID_SIZE + GRID_SIZE / 2,
                foodRadius,
                0,
                Math.PI * 2
            );
            ctx.fill();

            // 지렁이 그리기
            snake.forEach((segment, index) => {
                if (index === 0) {
                    // 머리
                    ctx.fillStyle = '#4ecca3';
                } else {
                    // 몸통 (그라데이션 느낌의 톤다운)
                    ctx.fillStyle = '#3ca884';
                }
                const padding = 1;
                ctx.fillRect(
                    segment.x * GRID_SIZE + padding,
                    segment.y * GRID_SIZE + padding,
                    GRID_SIZE - padding * 2,
                    GRID_SIZE - padding * 2
                );

                // 머리에 눈 그리기
                if (index === 0) {
                    ctx.fillStyle = '#111a2e';
                    const eyeSize = 3;
                    let eye1X, eye1Y, eye2X, eye2Y;
                    const cx = segment.x * GRID_SIZE + GRID_SIZE / 2;
                    const cy = segment.y * GRID_SIZE + GRID_SIZE / 2;

                    if (dx === 1) { // 오른쪽
                        eye1X = cx + 3; eye1Y = cy - 4;
                        eye2X = cx + 3; eye2Y = cy + 4;
                    } else if (dx === -1) { // 왼쪽
                        eye1X = cx - 3; eye1Y = cy - 4;
                        eye2X = cx - 3; eye2Y = cy + 4;
                    } else if (dy === 1) { // 아래
                        eye1X = cx - 4; eye1Y = cy + 3;
                        eye2X = cx + 4; eye2Y = cy + 3;
                    } else { // 위
                        eye1X = cx - 4; eye1Y = cy - 3;
                        eye2X = cx + 4; eye2Y = cy - 3;
                    }
                    ctx.fillRect(eye1X - eyeSize / 2, eye1Y - eyeSize / 2, eyeSize, eyeSize);
                    ctx.fillRect(eye2X - eyeSize / 2, eye2Y - eyeSize / 2, eyeSize, eyeSize);
                }
            });
        }

        window.addEventListener('keydown', (e) => {
            const key = e.key;

            if (key === ' ' || key === 'Spacebar') {
                if (isRunning) {
                    isPaused = !isPaused;
                    overlayTitle.textContent = isPaused ? '일시 정지' : '';
                    startBtn.textContent = '계속하기';
                    overlay.style.display = isPaused ? 'flex' : 'none';
                }
                return;
            }

            // 방향 전환 (반대 방향 즉시 이동 방지)
            if ((key === 'ArrowUp' || key === 'w' || key === 'W') && dy === 0) {
                nextDx = 0;
                nextDy = -1;
            } else if ((key === 'ArrowDown' || key === 's' || key === 'S') && dy === 0) {
                nextDx = 0;
                nextDy = 1;
            } else if ((key === 'ArrowLeft' || key === 'a' || key === 'A') && dx === 0) {
                nextDx = -1;
                nextDy = 0;
            } else if ((key === 'ArrowRight' || key === 'd' || key === 'D') && dx === 0) {
                nextDx = 1;
                nextDy = 0;
            }
        });

        startBtn.addEventListener('click', () => {
            if (isPaused) {
                isPaused = false;
                overlay.style.display = 'none';
            } else {
                startGame();
            }
        });

        // 초기 화면 그리기
        initGame();
        draw();
    </script>
</body>
</html>
